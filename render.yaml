services:
  - type: web
    name: balancevault
    runtime: node
    buildCommand: npm ci --include=dev --prefix backend && npm run prisma:generate --prefix backend && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGINS
        sync: false
      - key: CSRF_SECRET
        generateValue: true
